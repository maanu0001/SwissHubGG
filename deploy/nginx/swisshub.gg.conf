##############################################################################
# SwissHub – Nginx-Konfiguration
#
# Ablage auf dem Server:  /etc/nginx/sites-available/swisshub.gg
# Aktivieren:             ln -s /etc/nginx/sites-available/swisshub.gg \
#                            /etc/nginx/sites-enabled/swisshub.gg
# Prüfen und laden:       nginx -t && systemctl reload nginx
#
# Die TLS-Zertifikate stammen aus Let's Encrypt (certbot). Die Anwendung selbst
# lauscht nur auf 127.0.0.1:3000 und ist von aussen nicht direkt erreichbar.
##############################################################################

# Rate Limits als zusätzliche Ebene vor der Anwendung.
limit_req_zone $binary_remote_addr zone=swisshub_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=swisshub_sensitive:10m rate=2r/s;

upstream swisshub_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP: ausschliesslich Weiterleitung auf HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name swisshub.gg www.swisshub.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://swisshub.gg$request_uri;
    }
}

# www auf die Hauptdomain umleiten (eine kanonische Adresse).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.swisshub.gg;

    ssl_certificate     /etc/letsencrypt/live/swisshub.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swisshub.gg/privkey.pem;

    return 301 https://swisshub.gg$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name swisshub.gg;

    ssl_certificate     /etc/letsencrypt/live/swisshub.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swisshub.gg/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Sicherheitsheader setzt die Anwendung selbst (inklusive CSP mit Nonce).
    # HSTS wird hier zusätzlich verankert, damit es auch bei Fehlerseiten greift.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    server_tokens off;
    client_max_body_size 15m;
    client_body_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml application/xml;

    access_log /var/log/nginx/swisshub.access.log;
    error_log  /var/log/nginx/swisshub.error.log warn;

    # Unveränderliche Build-Artefakte dürfen sehr lange zwischengespeichert werden.
    location /_next/static/ {
        proxy_pass http://swisshub_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /fonts/ {
        proxy_pass http://swisshub_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /brand/ {
        proxy_pass http://swisshub_app;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Ausgelieferte Medien: der Speicherschlüssel ist zufällig und stabil.
    location /api/media/ {
        proxy_pass http://swisshub_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anmeldung und Kontaktformular strenger begrenzen.
    location ~ ^/(admin/login|api/track) {
        limit_req zone=swisshub_sensitive burst=10 nodelay;

        proxy_pass http://swisshub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        limit_req zone=swisshub_general burst=40 nodelay;

        proxy_pass http://swisshub_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
