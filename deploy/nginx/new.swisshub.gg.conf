##############################################################################
# SwissHub – Weiterleitung der abgelösten Domain (Nginx)
#
# Ablage auf dem Server:  /etc/nginx/sites-available/new.swisshub.gg
# Aktivieren:             ln -s /etc/nginx/sites-available/new.swisshub.gg \
#                             /etc/nginx/sites-enabled/new.swisshub.gg
# Prüfen und laden:       nginx -t && systemctl reload nginx
#
# Nur nötig, solange die Website über Nginx ausgeliefert wird. Bei Apache
# erledigt das der entsprechende VirtualHost in deploy/apache/swisshub.gg.conf.
#
# Das Zertifikat für new.swisshub.gg wird weiterhin gebraucht: Ohne gültiges
# Zertifikat scheitert der Verbindungsaufbau, bevor die Weiterleitung greifen
# kann. Es sollte daher so lange erneuert werden, wie noch alte Links im Umlauf
# sind.
##############################################################################

server {
    listen 80;
    listen [::]:80;
    server_name new.swisshub.gg;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://swisshub.gg$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name new.swisshub.gg;

    ssl_certificate     /etc/letsencrypt/live/new.swisshub.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.swisshub.gg/privkey.pem;

    # `$request_uri` enthält Pfad und Suchparameter unverändert; die Sprungmarke
    # verlässt den Browser ohnehin nie. 301 ist dauerhaft – Suchmaschinen
    # übertragen die Bewertung damit auf die neue Adresse.
    return 301 https://swisshub.gg$request_uri;
}
