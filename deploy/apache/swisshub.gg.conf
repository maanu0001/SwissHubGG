##############################################################################
# SwissHub – Apache-Konfiguration
#
# Ablage auf dem Server:  /etc/apache2/sites-available/swisshub.gg.conf
# Aktivieren:             a2ensite swisshub.gg
# Prüfen und laden:       apachectl configtest && systemctl reload apache2
#
# Benötigte Module:
#   a2enmod proxy proxy_http headers rewrite ssl
#
# Die Anwendung lauscht nur auf 127.0.0.1:3000 und ist von aussen nie direkt
# erreichbar. Läuft sie unter einem anderen Port, hier und in der .env nichts
# weiter ändern: APP_URL bleibt immer die öffentliche Adresse.
##############################################################################

# --- HTTP: ausschliesslich Weiterleitung auf HTTPS ---------------------------
<VirtualHost *:80>
    ServerName  swisshub.gg
    ServerAlias www.swisshub.gg new.swisshub.gg

    # Zertifikatserneuerung muss unverschlüsselt durchkommen.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://swisshub.gg/$1 [R=301,L,QSA]
</VirtualHost>

# --- Abgelöste Domain: dauerhaft auf die produktive Domain -------------------
#
# Pfad, Suchparameter und Sprungmarke bleiben erhalten: `$1` übernimmt den
# Pfad, `QSA` hängt die vorhandene Abfrage an, die Sprungmarke verlässt den
# Browser ohnehin nie. `R=301` ist dauerhaft – Suchmaschinen übertragen die
# Bewertung damit auf die neue Adresse.
#
# Das Zertifikat für new.swisshub.gg wird weiterhin gebraucht: Ohne gültiges
# Zertifikat scheitert der Verbindungsaufbau, bevor die Weiterleitung greifen
# kann. Es sollte daher so lange erneuert werden, wie noch alte Links im Umlauf
# sind – erfahrungsgemäss mindestens ein Jahr.
<VirtualHost *:443>
    ServerName new.swisshub.gg

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/new.swisshub.gg/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/new.swisshub.gg/privkey.pem

    RewriteEngine On
    RewriteRule ^/?(.*)$ https://swisshub.gg/$1 [R=301,L,QSA]
</VirtualHost>

# --- www auf die Hauptdomain umleiten (eine kanonische Adresse) --------------
<VirtualHost *:443>
    ServerName www.swisshub.gg

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/swisshub.gg/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/swisshub.gg/privkey.pem

    RewriteEngine On
    RewriteRule ^/?(.*)$ https://swisshub.gg/$1 [R=301,L,QSA]
</VirtualHost>

# --- Die Website -------------------------------------------------------------
<VirtualHost *:443>
    ServerName swisshub.gg

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/swisshub.gg/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/swisshub.gg/privkey.pem

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off
    SSLSessionTickets       off

    # HSTS zusätzlich hier verankern, damit es auch bei Fehlerseiten greift.
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    ServerTokens Prod
    ServerSignature Off

    #
    # Ohne diese Zeile schlagen Server Actions fehl: Next.js nimmt eine Server
    # Action nur an, wenn Origin und Host zusammenpassen. Standardmässig meldet
    # Apache dem Ziel seine eigene Adresse (127.0.0.1:3000) – der Browser sendet
    # aber die öffentliche. Jedes Speichern im Dashboard scheiterte dann, ohne
    # dass im Formular ein Fehler sichtbar würde.
    #
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPass        /.well-known/acme-challenge/ !
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ProxyTimeout 60

    # Die übrigen Sicherheitsheader setzt die Anwendung selbst, inklusive der
    # Content-Security-Policy mit Nonce.

    ErrorLog  ${APACHE_LOG_DIR}/swisshub.error.log
    CustomLog ${APACHE_LOG_DIR}/swisshub.access.log combined
</VirtualHost>
